name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Install Android SDK packages
        run: |
          ls "$ANDROID_HOME/cmdline-tools" || true
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-28" "build-tools;28.0.3"
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 6.7.1
          build-root-directory: mirsal/mirsal/android
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mirsal-apk
          path: mirsal/mirsal/android/app/build/outputs/apk/debug/*.apk
