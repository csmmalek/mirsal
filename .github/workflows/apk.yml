name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 6.7.1
          build-root-directory: mirsal/mirsal/android
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mirsal-apk
          path: mirsal/mirsal/android/app/build/outputs/apk/debug/*.apk
