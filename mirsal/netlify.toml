[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# طلبات الـ API تذهب إلى الدالة
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# أي مسار آخر يعيد واجهة التطبيق
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
